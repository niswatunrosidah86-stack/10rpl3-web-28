<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Form Biodata Siswa</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <!-- Dekorasi -->
    <div class="dekorasi dekorasi-1">🌸</div>
    <div class="dekorasi dekorasi-2">✨</div>
    <div class="dekorasi dekorasi-3">🎀</div>
    <div class="dekorasi dekorasi-4">⭐</div>


    <div class="page">

        <div class="card">

            <div class="page-header">

                <h1>
                    🌸 Form Biodata Siswa 🌸
                </h1>

                <p>
                    Silakan isi data biodata kamu dengan lengkap
                </p>

            </div>


            <form action="#" method="post">


                <!-- NAMA -->
                <div class="form-group">

                    <label for="nama">
                        👤 Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama lengkap"
                        value=""
                        required
                    >

                </div>


                <!-- ALAMAT -->
                <div class="form-group">

                    <label for="alamat">
                        🏠 Alamat
                    </label>

                    <textarea
                        id="alamat"
                        name="alamat"
                        placeholder="Masukkan alamat"
                        required
                    ></textarea>

                </div>


                <!-- JURUSAN -->
                <div class="form-group">

                    <label for="jurusan">
                        🎓 Jurusan
                    </label>

                    <select
                        id="jurusan"
                        name="jurusan"
                        required
                    >

                        <option value="RPL" selected>
                            RPL
                        </option>

                        <option value="TKJ">
                            TKJ
                        </option>

                        <option value="TKR">
                            TKR
                        </option>

                        <option value="TSM">
                            TSM
                        </option>

                        <option value="TEI">
                            TEI
                        </option>

                    </select>

                </div>


                <!-- JENIS KELAMIN -->
                <div class="form-group">

                    <label>
                        🧑 Jenis Kelamin
                    </label>

                    <div class="radio-group">

                        <label>

                            <input
                                type="radio"
                                name="jenis_kelamin"
                                value="L"
                            >

                            Laki-laki

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="jenis_kelamin"
                                value="P"
                                checked
                            >

                            Perempuan

                        </label>

                    </div>

                </div>


                <!-- BERAT BADAN -->
                <div class="form-group">

                    <label for="bb">
                        ⚖️ Berat Badan (kg)
                    </label>

                    <input
                        type="number"
                        id="bb"
                        name="bb"
                        placeholder=""
                        value=""
                        min="1"
                    >

                </div>


                <!-- TINGGI BADAN -->
                <div class="form-group">

                    <label for="tb">
                        📏 Tinggi Badan (cm)
                    </label>

                    <input
                        type="number"
                        id="tb"
                        name="tb"
                        placeholder=""
                        value=""
                        min="1"
                    >

                </div>


                <!-- HOBI -->
                <div class="form-group">

                    <label for="hobi">
                        🎨 Hobi
                    </label>

                    <input
                        type="text"
                        id="hobi"
                        name="hobi"
                        placeholder=""
                        value=""
                    >

                </div>


                <!-- NO HP -->
                <div class="form-group">

                    <label for="nohp">
                        📱 No. HP
                    </label>

                    <input
                        type="number"
                        id="nohp"
                        name="nohp"
                        placeholder=""
                        value=""
                    >

                </div>


                <!-- TOMBOL -->
                <div class="form-button">

                    <input
                        type="submit"
                        value="💾 Simpan Data"
                    >

                    <button
                        type="reset"
                        class="btn-reset"
                    >
                        🔄 Reset
                    </button>

                </div>

            </form>


            <!-- NAVIGASI -->

            <div class="navigation">

                <a
                    href="index.html"
                    class="back-link"
                >
                    🏠 Kembali ke Halaman Utama
                </a>

            </div>

        </div>


        <footer>
            Dibuat dengan ❤️ & Banyak Senyuman ✨
        </footer>

    </div>

</body>
</html>
